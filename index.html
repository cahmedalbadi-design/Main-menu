<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الدخول - نسخة تشخيصية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            margin-bottom: 15px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; }
        input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 15px; transition: all 0.3s;
        }
        input:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .message {
            margin-top: 20px; padding: 12px; border-radius: 10px;
            text-align: center; font-size: 14px; display: none;
        }
        .message.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .spinner {
            display: none; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-left: 10px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .redirecting {
            display: none; text-align: center; margin-top: 20px;
            padding: 20px; background: #e8f5e9; border-radius: 12px;
            border-right: 4px solid #4caf50;
        }
        .redirect-spinner {
            width: 40px; height: 40px;
            border: 4px solid #e0e0e0; border-top-color: #4caf50;
            border-radius: 50%; animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        .debug-info {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            direction: ltr;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <div class="logo-icon">🔐</div>
        <h2>تسجيل الدخول</h2>
        <p class="subtitle">أدخل بياناتك للوصول إلى النظام</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
        </div>
        <button type="submit" id="submitBtn">
            <span class="spinner" id="spinner"></span>
            تسجيل الدخول
        </button>
    </form>

    <div id="message" class="message"></div>
    <div id="redirecting" class="redirecting">
        <div class="redirect-spinner"></div>
        <h3>✅ تم تسجيل الدخول بنجاح!</h3>
        <p>جاري تحويلك إلى النموذج...</p>
        <button id="manualRedirectBtn" style="background:#4caf50; margin-top:15px; width:auto; padding:8px 20px;">الانتقال الآن</button>
    </div>
    <div class="debug-info" id="debugInfo">
        🔍 جاهزية النظام: تم تحميل الصفحة بنجاح
    </div>
</div>

<script>
    // ========== إعدادات ==========
    // ⚠️ استبدل هذا الرابط برابط Web App الخاص بك بعد النشر
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzpirrnWac6ERXtSdsXJqkL6nj8uz8bI4E23w7lvhRMTaD-IGhqfbTVb_Ny9ZKC0m72Dw/exec';
    const REDIRECT_URL = 'https://forms.gle/GMUzzHKf4mPnehxQA';
    
    // عناصر DOM
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const messageDiv = document.getElementById('message');
    const redirectingDiv = document.getElementById('redirecting');
    const manualRedirectBtn = document.getElementById('manualRedirectBtn');
    const debugInfo = document.getElementById('debugInfo');

    // دالة عرض رسائل للمستخدم
    function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        // إخفاء تلقائي بعد 5 ثوانٍ للخطأ
        if (type === 'error') {
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
        debugInfo.innerHTML = `📢 ${text.substring(0, 80)}`;
    }

    // دالة تحديث معلومات التصحيح
    function updateDebug(msg) {
        debugInfo.innerHTML = `🔍 ${msg}`;
        console.log(msg);
    }

    // حدث تقديم النموذج - مع تأكيد أنه يعمل
    loginForm.addEventListener('submit', async function(event) {
        // منع إعادة تحميل الصفحة
        event.preventDefault();
        updateDebug('تم拦截 submit، بدء عملية تسجيل الدخول...');
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showMessage('الرجاء إدخال اسم المستخدم وكلمة المرور', 'error');
            updateDebug('فشل التحقق: حقول فارغة');
            return;
        }

        updateDebug(`محاولة الدخول للمستخدم: ${username}`);
        
        // تعطيل الزر وإظهار الدوار
        submitBtn.disabled = true;
        spinner.style.display = 'inline-block';
        messageDiv.style.display = 'none';

        try {
            // إرسال الطلب إلى Web App
            const body = `action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
            updateDebug(`إرسال طلب إلى ${WEB_APP_URL}`);
            
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body,
                mode: 'cors'   // مهم لطلب CORS
            });
            
            updateDebug(`استجابة HTTP: ${response.status} ${response.statusText}`);
            
            if (!response.ok) {
                throw new Error(`خطأ في الخادم (${response.status})`);
            }
            
            // تحويل الاستجابة إلى JSON
            const data = await response.json();
            updateDebug(`استجابة الخادم: success=${data.success}`);
            
            if (data.success === true) {
                // حفظ الجلسة
                sessionStorage.setItem('currentUser', JSON.stringify(data.user || { username }));
                sessionStorage.setItem('loginTime', Date.now());
                
                // إخفاء النموذج وإظهار شاشة التحويل
                loginForm.style.display = 'none';
                redirectingDiv.style.display = 'block';
                updateDebug('تسجيل دخول ناجح، سيتم التوجيه خلال 2 ثانية');
                
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, 2000);
            } else {
                const errMsg = data.message || 'اسم المستخدم أو كلمة المرور غير صحيحة';
                showMessage(errMsg, 'error');
                updateDebug(`فشل المصادقة: ${errMsg}`);
                document.getElementById('password').value = ''; // مسح كلمة المرور
            }
        } catch (error) {
            console.error(error);
            let errorMsg = 'حدث خطأ في الاتصال بالخادم.';
            if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                errorMsg = 'لا يمكن الاتصال بـ Web App. تأكد من نشر التطبيق وصلاحية "أي شخص" والرابط صحيح.';
            } else if (error.message.includes('CORS')) {
                errorMsg = 'مشكلة CORS: يجب نشر Apps Script مع صلاحية الوصول "أي شخص" أو "أي شخص لديه الرابط".';
            } else {
                errorMsg = `خطأ: ${error.message}`;
            }
            showMessage(errorMsg, 'error');
            updateDebug(`خطأ في الطلب: ${error.message}`);
        } finally {
            submitBtn.disabled = false;
            spinner.style.display = 'none';
        }
    });
    
    // زر الانتقال اليدوي
    if (manualRedirectBtn) {
        manualRedirectBtn.addEventListener('click', () => {
            window.location.href = REDIRECT_URL;
        });
    }
    
    // عند تحميل الصفحة، التحقق من جلسة سابقة
    window.addEventListener('load', function() {
        updateDebug('تم تحميل الصفحة بالكامل، وجاهز لاستقبال الإدخال');
        const savedUser = sessionStorage.getItem('currentUser');
        const loginTime = sessionStorage.getItem('loginTime');
        if (savedUser && loginTime) {
            const elapsed = Date.now() - parseInt(loginTime);
            if (elapsed < 3600000) { // أقل من ساعة
                updateDebug('تم العثور على جلسة سابقة صالحة، توجيه تلقائي');
                loginForm.style.display = 'none';
                redirectingDiv.style.display = 'block';
                setTimeout(() => { window.location.href = REDIRECT_URL; }, 1000);
            } else {
                sessionStorage.removeItem('currentUser');
                sessionStorage.removeItem('loginTime');
                updateDebug('انتهت صلاحية الجلسة السابقة');
            }
        }
    });
    
    // إضافة إشارة إضافية: إذا لم يظهر أي شيء، هذا يعني أن السكربت لم ينفذ.
    updateDebug('تم تهيئة جميع المستمعين بنجاح');
</script>

</body>
</html>
