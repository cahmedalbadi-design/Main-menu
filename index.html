<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a3a5c;
      --accent: #2e7dcd;
      --accent-light: #e8f2fc;
      --bg: #f0f4f9;
      --card-bg: #ffffff;
      --text: #1a2535;
      --muted: #6b7a8d;
      --border: #d0dae6;
      --success: #1a7a4a;
      --success-bg: #e6f5ed;
      --error: #c0392b;
      --error-bg: #fdecea;
      --input-bg: #f7f9fc;
      --input-focus: #2e7dcd;
      --radius: 12px;
      --shadow: 0 8px 40px rgba(30,60,100,0.13);
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px; left: -120px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(46,125,205,0.13) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -100px;
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(26,58,92,0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-circle {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(46,125,205,0.25);
    }

    .logo-circle svg {
      width: 36px; height: 36px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      display: flex;
    }

    .input-icon svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 44px 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--input-bg);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      direction: ltr;
      text-align: right;
    }

    input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(46,125,205,0.13);
      background: #fff;
    }

    .toggle-pass {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 2px;
      display: flex;
      transition: color 0.2s;
    }

    .toggle-pass:hover { color: var(--accent); }
    .toggle-pass svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }

    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn svg {
      width: 18px; height: 18px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 16px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .alert.error {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid #f5c6c1;
    }

    .alert.success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #b2dfcd;
    }

    .welcome-screen {
      display: none;
      text-align: center;
      padding: 16px 0 8px;
    }

    .welcome-icon {
      width: 72px; height: 72px;
      background: var(--success-bg);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .welcome-icon svg {
      width: 36px; height: 36px;
      stroke: var(--success);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .welcome-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .welcome-msg {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }

    .back-btn {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: var(--radius);
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 20px;
      cursor: pointer;
      margin-top: 20px;
      transition: border-color 0.2s, color 0.2s;
    }

    .back-btn:hover { border-color: var(--accent); color: var(--accent); }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 32px 22px 28px; margin: 16px; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Login Form -->
  <div id="loginView">
    <div class="logo-area">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2z"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
      <h1>تسجيل الدخول</h1>
      <p class="subtitle">أدخل بيانات حسابك للمتابعة</p>
    </div>

    <div class="form-group">
      <label for="username">اسم المستخدم</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </span>
        <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username"/>
      </div>
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password"/>
        <button class="toggle-pass" type="button" id="togglePass" aria-label="إظهار/إخفاء كلمة المرور">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn" id="loginBtn" type="button">
      <span id="btnText">دخول</span>
      <div class="spinner" id="spinner"></div>
      <svg id="btnIcon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </button>

    <div class="alert error" id="errorMsg">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorText">اسم المستخدم أو كلمة المرور غير صحيحة.</span>
    </div>

    <div class="footer">
      البيانات محمية ومشفرة — جميع الحقوق محفوظة
    </div>
  </div>

  <!-- Welcome Screen -->
  <div class="welcome-screen" id="welcomeView">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <p class="welcome-name" id="welcomeName">مرحباً!</p>
    <p class="welcome-msg">تم تسجيل دخولك بنجاح. يسعدنا وجودك معنا.</p>
    <br/>
    <button class="back-btn" id="logoutBtn">← تسجيل الخروج</button>
  </div>

</div>

<script>
  const SHEET_ID = '1mqWU5jNw8PZhJP-j3QLdDBjO8OxyT9xjiU5dIJ0BHgA';
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

  const loginBtn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  const loginView = document.getElementById('loginView');
  const welcomeView = document.getElementById('welcomeView');
  const welcomeName = document.getElementById('welcomeName');
  const togglePass = document.getElementById('togglePass');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  togglePass.addEventListener('click', () => {
    const isPass = passwordInput.type === 'password';
    passwordInput.type = isPass ? 'text' : 'password';
    eyeIcon.innerHTML = isPass ? eyeClosed : eyeOpen;
  });

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
    return lines.slice(1).map(line => {
      const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
      const obj = {};
      headers.forEach((h, i) => { obj[h] = vals[i] || ''; });
      return obj;
    });
  }

  function setLoading(state) {
    loginBtn.disabled = state;
    spinner.style.display = state ? 'block' : 'none';
    btnText.textContent = state ? 'جارٍ التحقق...' : 'دخول';
    btnIcon.style.display = state ? 'none' : 'block';
  }

  function showError(msg) {
    errorText.textContent = msg;
    errorMsg.style.display = 'flex';
    errorMsg.className = 'alert error';
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  loginBtn.addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = passwordInput.value.trim();

    hideError();

    if (!username || !password) {
      showError('الرجاء إدخال اسم المستخدم وكلمة المرور.');
      return;
    }

    setLoading(true);

    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error('فشل تحميل البيانات');
      const csv = await res.text();
      const users = parseCSV(csv);

      const usernameKey = Object.keys(users[0] || {}).find(k =>
        k.includes('user') || k.includes('اسم') || k.includes('username') || k === 'user'
      );
      const passwordKey = Object.keys(users[0] || {}).find(k =>
        k.includes('pass') || k.includes('كلمة') || k.includes('password') || k === 'pass'
      );
      const nameKey = Object.keys(users[0] || {}).find(k =>
        k.includes('name') || k.includes('الاسم') || k.includes('full') || k === 'name'
      );

      if (!usernameKey || !passwordKey) {
        showError('تعذّر العثور على أعمدة المستخدم أو كلمة المرور في البيانات.');
        setLoading(false);
        return;
      }

      const match = users.find(u =>
        (u[usernameKey] || '').toLowerCase() === username.toLowerCase() &&
        (u[passwordKey] || '') === password
      );

      if (match) {
        const displayName = nameKey ? (match[nameKey] || username) : username;
        welcomeName.textContent = `مرحباً، ${displayName}!`;
        loginView.style.display = 'none';
        welcomeView.style.display = 'block';
      } else {
        showError('اسم المستخدم أو كلمة المرور غير صحيحة. حاول مجدداً.');
      }

    } catch (err) {
      showError('حدث خطأ أثناء الاتصال. تأكد من مشاركة الجدول بشكل عام، أو حاول مرة أخرى.');
      console.error(err);
    }

    setLoading(false);
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    welcomeView.style.display = 'none';
    loginView.style.display = 'block';
    document.getElementById('username').value = '';
    passwordInput.value = '';
    hideError();
  });

  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') passwordInput.focus();
  });

  passwordInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') loginBtn.click();
  });
</script>
</body>
</html>
